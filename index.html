<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行大富翁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Permanent+Marker&family=VT323&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE playful scrapbook table of contents for a couple's trip-choosing games
   IDEA a passport / travel journal: each trip is a stamped passport page, empty pages wait for the next country
   PICTURE the grid of chapter pages, Europe stamped and open, blank pages taped in for later
   COLOUR kraft board, paper cards, tomato + mustard + teal tape, orange CCD date stamps
   TYPE LXGW WenKai TC + Permanent Marker + VT323
   LAYOUT title collage on top, chapter cards in a responsive grid; phone: one column */
:root{color-scheme:light;--kraft:#e9dcc3;--paper:#fffdf6;--ink:#2b2622;--mute:#6f655b;--red:#e4572e;--mus:#f2b134;--teal:#2f8f86;--pink:#f4a6b8;--blue:#4a78c2}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{color:var(--ink);font:16px/1.6 "LXGW WenKai TC","Noto Sans TC",sans-serif;background-color:var(--kraft);background-image:radial-gradient(rgba(120,90,50,.10) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.2px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;min-height:100vh;overflow-x:clip}
.topbar{display:flex;align-items:center;gap:10px;padding:10px max(4vw,14px);background:var(--ink);color:#fff;font-family:"VT323",monospace;font-size:20px;letter-spacing:.05em}
.topbar i{width:11px;height:11px;border-radius:50%;background:#ff3b30;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
main{max-width:1080px;margin:0 auto;padding:clamp(22px,4vw,48px) max(5vw,16px) 70px}
.head{text-align:center;margin-bottom:30px}
.title{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 3px;margin:6px 0 8px}
.title span{display:inline-grid;place-items:center;min-width:52px;height:60px;padding:0 6px;font-size:40px;font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.mk{font-family:"Permanent Marker",cursive;color:var(--red);font-size:20px;margin:0}
.lede{margin:6px auto 0;max-width:44ch;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px 26px}
.page{position:relative;background:var(--paper);padding:22px 20px 20px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 12px 24px rgba(60,40,10,.18);border-radius:3px}
.page:nth-child(odd){transform:rotate(-.8deg)}.page:nth-child(even){transform:rotate(.8deg)}
.tape{position:absolute;width:96px;height:26px;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);background:repeating-linear-gradient(45deg,rgba(244,166,184,.85) 0 7px,rgba(255,214,222,.85) 7px 14px)}
.tape.y{background:repeating-linear-gradient(90deg,rgba(242,177,52,.85) 0 10px,rgba(255,224,150,.85) 10px 20px)}
.tape.t{background:rgba(47,143,134,.55);background-image:radial-gradient(rgba(255,255,255,.7) 1.5px,transparent 2px);background-size:9px 9px}
.ch{font-family:"Permanent Marker",cursive;font-size:15px;color:var(--mute);letter-spacing:.08em}
.page h2{font-size:30px;margin:2px 0 4px;line-height:1.15}
.when{white-space:nowrap;font-family:"VT323",monospace;font-size:20px;color:#e07b1c;letter-spacing:.05em}
.route{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.route span{background:var(--k);color:#fff;font-size:14px;font-weight:700;padding:2px 10px;border-radius:3px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.stamp{position:absolute;right:14px;top:16px;width:84px;height:84px;border-radius:50%;border:3px double var(--c);color:var(--c);display:grid;place-items:center;text-align:center;font-family:"Permanent Marker",cursive;font-size:13px;line-height:1.15;transform:rotate(12deg);opacity:.85}
.stamp b{display:block;font-family:"LXGW WenKai TC",sans-serif;font-size:20px}
.note{font-size:14px;color:var(--mute);margin:8px 0 0}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:8px 16px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 12px rgba(60,40,10,.15);transform:rotate(-1deg);transition:transform .12s}
.btn:nth-child(even){transform:rotate(1deg)}
.btn.main{background:var(--red);color:#fff;letter-spacing:.1em}
.btn:hover{transform:scale(1.03)}
.btn:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
.blank{background:rgba(255,253,246,.55);border:3px dashed rgba(43,38,34,.3);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:300px;color:var(--mute)}
.blank .plus{width:70px;height:70px;border-radius:50%;border:3px dashed rgba(43,38,34,.35);display:grid;place-items:center;font-family:"Permanent Marker",cursive;font-size:40px;color:rgba(43,38,34,.45);margin-bottom:10px}
.blank h2{font-size:24px;color:var(--ink)}
footer{text-align:center;font-size:13px;color:var(--mute);margin-top:40px;font-family:"Noto Sans TC",sans-serif}
@media(max-width:600px){.title span{min-width:42px;height:50px;font-size:32px}.page h2{font-size:26px}.stamp{width:72px;height:72px;font-size:12px}.stamp b{font-size:17px}}
@media(prefers-reduced-motion:reduce){.topbar i{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="topbar"><i></i>REC&nbsp;&nbsp;OUR TRIPS</div>
<main>
<div class="head">
<p class="mk">Travel Board Game · Our Trips</p>
<h1 class="title" id="title" aria-label="旅行大富翁"></h1>
<p class="lede">每一趟旅行都是一篇。打開一篇，抽機會卡、擲骰子，決定我們要走哪條路。</p>
</div>
<div class="grid" id="grid"></div>
<footer>新的國家會一篇一篇加進來。</footer>
</main>
<script>
{
/* 新增國家：在 TRIPS 加一筆，status 用 "open" 並填上 links；空白欄位會自動補在最後 */
const TRIPS=[
 {ch:"Chapter 01",name:"歐洲篇",when:"'26.12.24 — '27.01.04",status:"open",stamp:["EUROPE","跨年"],color:"#e4572e",tape:"",
  route:[["阿姆斯特丹","#f7941d"],["冰島","#6cc6ee"],["Tromsø","#1fb25a"],["巴黎","#d93a96"],["布魯塞爾","#d9a514"]],
  note:"四條路線：冰島自駕，或挪威追極光＋迪士尼跨年。",
  links:[["拼貼 vlog 版","europe/","main"],["大富翁桌遊版","europe/boardgame.html",""]]}
];
const BLANKS=2;
const pal=[["#e4572e","#fff"],["#fffdf6","#2b2622"],["#f2b134","#2b2622"],["#2b2622","#fff"],["#2f8f86","#fff"]];
let r=9;const rnd=()=>(r=r*16807%2147483647)/2147483647;
document.getElementById("title").innerHTML=[..."旅行大富翁"].map((c,i)=>{const [bg,fg]=pal[i%pal.length];return `<span aria-hidden="true" style="background:${bg};color:${fg};transform:rotate(${(rnd()*12-6).toFixed(1)}deg)">${c}</span>`}).join("");
const tapes=["","y","t"];
const n=TRIPS.length;
document.getElementById("grid").innerHTML=TRIPS.map((t,i)=>`<article class="page"><span class="tape ${t.tape||tapes[i%3]}"></span>
<span class="stamp" style="--c:${t.color}"><span>${t.stamp[0]}<b>${t.stamp[1]}</b></span></span>
<div class="ch">${t.ch}</div><h2>${t.name}</h2><div class="when">${t.when}</div>
<div class="route">${t.route.map(([x,c])=>`<span style="--k:${c}">${x}</span>`).join("")}</div>
<p class="note">${t.note}</p>
<div class="btns">${t.links.map(([l,h,c])=>`<a class="btn ${c}" href="${h}">${l}</a>`).join("")}</div></article>`).join("")+
[...Array(BLANKS)].map((_,j)=>`<article class="page blank"><span class="tape ${tapes[(n+j)%3]}"></span><div class="plus">+</div><div class="ch">Chapter ${String(n+j+1).padStart(2,"0")}</div><h2>下一個國家？</h2><p class="note">還沒寫的這一篇，等下一趟旅行。</p></article>`).join("");
}
</script>
</body>
</html>
